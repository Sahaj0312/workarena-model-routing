[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workarena-model-routing"
version = "0.1.0"
description = "A small, reproducible WorkArena model baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "browsergym-workarena==0.5.3",
  "browsergym-core==0.14.3",
  "playwright==1.44.0",
  "openai>=2,<3",
  "python-dotenv>=1,<2",
]

[project.scripts]
workarena-baseline = "experiments.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["agent", "models", "experiments", "routers", "analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
